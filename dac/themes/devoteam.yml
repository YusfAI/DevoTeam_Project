# Thème Devoteam pour les dashboards DAC.
#
# Il existe parce que la zone dashboard, servie en iframe par DAC, gardait
# l'apparence par défaut de l'outil : l'application avait donc deux identités
# visuelles côte à côte. Les jetons ci-dessous reprennent EXACTEMENT ceux de
# frontend/src/styles/tokens.css — toute modification doit être répercutée des deux
# côtés, sinon l'écart réapparaît.
#
# Appliqué au lancement : dac serve --dir . --template themes/devoteam.yml
# (voir scripts/start_dev.bat).
#
# « extends » hérite des jetons non redéfinis du thème intégré, ce qui évite d'avoir
# à réénumérer ceux dont la valeur par défaut convient.
name: devoteam
extends: bruin

tokens:
  # --- Surfaces et texte : mêmes valeurs que le chat, pour une continuité visuelle ---
  background: "#f9f9f7"      # --surface-page
  surface: "#fcfcfb"         # --surface-card
  surface-hover: "#f2f2ef"
  border: "#e1e0d9"          # --gridline (valeur opaque : un rgba semi-transparent
                              # se comporterait mal sur les fonds superposés de DAC)
  text-primary: "#0b0b0b"
  text-secondary: "#52514e"
  text-muted: "#898781"

  # --- Corail Devoteam, repris du logo ---
  accent: "#f2405a"          # --brand-primary
  accent-hover: "#d42a45"    # --brand-primary-strong
  accent-subtle: "rgba(242, 64, 90, 0.08)"

  # --- États : mêmes teintes que les badges d'alerte du chat ---
  success: "#0ca30c"
  warning: "#fab219"
  error: "#d03b3b"

  # --- Palette de graphiques ---
  # Ce sont les huit teintes --series-1..8 de l'application, dont l'ordre a été validé
  # pour rester distinguable en vision daltonienne. Les reprendre ici plutôt que de
  # laisser la palette par défaut garantit que le même pays garde la même couleur
  # qu'il apparaisse dans un dashboard DAC ou ailleurs.
  #
  # Teintes approfondies : la version précédente laissait trois couleurs (vert, ambre,
  # rose) sous le rapport de contraste 3:1 avec la surface, ce que le validateur
  # signalait. Les nouvelles passent TOUS les contrôles sans avertissement, et la
  # séparation en vision daltonienne remonte de 6,2 à 8,1 ΔE sur la paire la plus
  # serrée — au-dessus de la cible, plus seulement du plancher.
  #
  # Toute modification doit être répercutée dans frontend/src/styles/tokens.css, et
  # revalidée : tests/test_palette.py vérifie que les deux fichiers ne divergent pas.
  chart-1: "#2a78d6"
  chart-2: "#d95f28"
  chart-3: "#0f9268"
  chart-4: "#b8860b"
  chart-5: "#cc4f86"
  chart-6: "#0b7a3f"
  chart-7: "#5b46c9"
  chart-8: "#c93838"
