schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Vue d'ensemble commerciale
description: Les cinq questions les plus fréquentes sur le portefeuille d'opportunités
connection: devoteam_duckdb

# Dashboard "as code" : versionné dans git, relu en revue, reproductible à
# l'identique sur n'importe quelle machine. Les données proviennent du fichier
# DuckDB réécrit à chaque rafraîchissement du Google Sheet (backend/duckdb_export.py).
#
# Le filtre ci-dessous est injecté en Jinja dans CHAQUE requête : changer la
# practice recalcule tout le dashboard côté SQL, sans rechargement de page.
filters:
  - name: practice
    type: select
    multiple: false
    default: "Toutes"
    options:
      values: ["Toutes", "Digital Transformation", "Risk Advisory", "Data Management"]

rows:
  # --- Ligne 1 : les chiffres clés, lisibles d'un coup d'œil ---
  - widgets:
      - name: Budget total
        type: metric
        col: 3
        sql: |
          SELECT SUM(budget) AS total FROM opportunities
          WHERE 1 = 1
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: total, type: number, format: ",.0f" }

      - name: Opportunités
        type: metric
        col: 3
        sql: |
          SELECT COUNT(*) AS total FROM opportunities
          WHERE 1 = 1
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: total, type: number, format: ",.0f" }

      - name: Montant pondéré
        type: metric
        col: 3
        description: Offre financière × probabilité de gain
        sql: |
          SELECT SUM(weighted_amount) AS total FROM opportunities
          WHERE 1 = 1
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: total, type: number, format: ",.0f" }

      - name: Probabilité de gain moyenne
        type: metric
        col: 3
        sql: |
          SELECT AVG(win_probability) AS taux FROM opportunities
          WHERE win_probability IS NOT NULL
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: taux, type: number, format: ".1%" }

  # --- Ligne 2 : « Où est l'argent ? » (Q1) et « comment se répartit-il ? » (Q2) ---
  - widgets:
      - name: Budget par pays
        type: chart
        chart: bar
        col: 7
        description: Les 10 pays au budget le plus élevé
        sql: |
          SELECT country, SUM(budget) AS budget FROM opportunities
          WHERE 1 = 1
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          GROUP BY 1
          ORDER BY 2 DESC
          LIMIT 10
        x: { field: country, type: category, title: Pays }
        y: { field: budget, type: number, title: Budget, format: ",.0f" }

      - name: Répartition par practice
        type: chart
        chart: pie
        col: 5
        description: Nombre d'opportunités par practice
        sql: |
          SELECT practice, COUNT(*) AS nb FROM opportunities
          WHERE 1 = 1
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          GROUP BY 1
          ORDER BY 2 DESC
        label: practice
        value: { field: nb }

  # --- Ligne 3 : « Où en est le pipeline ? » (Q3) et « quelles practices convertissent ? » (Q4) ---
  - widgets:
      - name: Entonnoir de vente
        type: chart
        chart: funnel
        col: 6
        description: Étapes du pipeline dans l'ordre réel du cycle de vente
        # ORDER BY sur l'ordre du pipeline, jamais sur la valeur : un entonnoir trié
        # par volume ne raconterait rien du parcours réel d'une opportunité. Les
        # statuts de SORTIE (perdu, NO GO, infructueux…) sont exclus — ce sont des
        # sorties du pipeline, pas des étapes que chaque opportunité traverse.
        sql: |
          SELECT status, COUNT(*) AS nb,
            CASE status
              WHEN 'Lead' THEN 1
              WHEN 'Opportunité détectée' THEN 2
              WHEN 'En cours de qualification' THEN 3
              WHEN 'Complément d''information' THEN 4
              WHEN 'En cours de préparation' THEN 5
              WHEN 'Propal shortlistée' THEN 6
              WHEN 'Manif shortlistée' THEN 7
              WHEN 'Manifestation remise' THEN 8
              WHEN 'Offre remise' THEN 9
              WHEN 'Offre gagnée' THEN 10
            END AS etape
          FROM opportunities
          WHERE status IN (
            'Lead', 'Opportunité détectée', 'En cours de qualification',
            'Complément d''information', 'En cours de préparation',
            'Propal shortlistée', 'Manif shortlistée', 'Manifestation remise',
            'Offre remise', 'Offre gagnée'
          )
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          GROUP BY 1
          ORDER BY etape
        label: status
        value: { field: nb }

      - name: Probabilité de gain par practice
        type: chart
        chart: bar
        col: 6
        description: Moyenne des probabilités renseignées
        sql: |
          SELECT practice, AVG(win_probability) AS taux FROM opportunities
          WHERE win_probability IS NOT NULL
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          GROUP BY 1
          ORDER BY 2 DESC
        x: { field: practice, type: category, title: Practice }
        y: { field: taux, type: number, title: Probabilité de gain, format: ".1%" }

  # --- Ligne 4 : « Qu'est-ce qui est urgent ? » (Q5) ---
  - widgets:
      - name: Opportunités urgentes (échéance ≤ 7 jours)
        type: table
        col: 12
        description: Opportunités actives uniquement — les statuts clos sont exclus
        sql: |
          SELECT buyer, country, practice, status, deadline, days_remaining, budget
          FROM opportunities
          WHERE days_remaining BETWEEN 0 AND 7
            AND status NOT IN (
              'Offre gagnée', 'Offre perdue', 'Offre signée', 'Infructueux',
              'NO GO', 'Hors scope', 'Non shortlisté'
            )
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          ORDER BY days_remaining ASC
        columns:
          - { name: buyer, label: Client }
          - { name: country, label: Pays }
          - { name: practice, label: Practice }
          - { name: status, label: Statut }
          - { name: deadline, label: Échéance }
          - { name: days_remaining, label: Jours restants, number: number }
          - { name: budget, label: Budget, number: currency }
