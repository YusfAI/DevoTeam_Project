schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Vue d'ensemble commerciale
description: Les offres remises depuis novembre 2025, ce qu'elles sont devenues, et l'état du portefeuille
connection: devoteam_duckdb

# ATTENTION : fichier PRODUIT par scripts/generate_accueil.py, à ne pas éditer à la
# main — toute modification directe serait perdue à la prochaine génération. Il reste
# versionné et relu en revue (c'est un dashboard « as code »), mais son générateur
# existe pour une raison précise : les 12 étapes du pipeline et la liste des statuts
# perdus sont recopiées dans plusieurs widgets, et deux copies qui divergent
# fausseraient les taux sans qu'aucun test ne le voie. Elles sont donc dérivées de
# backend/business_rules.py, source unique.
#
#   python scripts/generate_accueil.py     (depuis la racine du projet)
#
# Les données viennent du fichier DuckDB réécrit à chaque rafraîchissement du Google
# Sheet (backend/duckdb_export.py).
#
# CE QU'EST UNE « OFFRE REMISE ». Le statut décrit l'état COURANT : une offre partie
# chez le client et gagnée depuis n'est plus au statut « Offre remise ». Compter ce
# seul statut donnerait 4 offres au lieu de 57. Sont donc comptées comme remises les
# opportunités dont le statut atteste le dépôt — Offre remise, En attente du plan de
# charge, Offre gagnée, Offre signée, Offre perdue (définition arrêtée avec le métier,
# voir business_rules.SUBMITTED_STATUSES).
#
# « À DATE ». Il n'existe pas de colonne « date de remise » : l'échéance en tient
# lieu, car pour un appel d'offres la date limite de dépôt EST la date de remise. La
# borne haute est aujourd'hui — une échéance à venir signifie que l'offre n'est pas
# encore partie (20 opportunités sont dans ce cas et sortent donc du compte).
#
# EXCLUSION DES AFFAIRES PERDUES. La règle par défaut de l'application les écarte de
# tous les chiffres (66,1 M€ d'affaires mortes dans un « budget total » ne servent
# aucune décision). Elle est LEVÉE dans le bloc « offres remises », qui filtre
# lui-même sur le statut : c'est exactement l'échappatoire prévue — sans elle, la
# question « combien de perdues ? » ne pourrait pas recevoir de réponse. Le bloc
# « portefeuille » plus bas, lui, applique l'exclusion.
#
# Les 12 étapes de l'entonnoir sont la transcription exacte de
# business_rules.FUNNEL_STAGE_ORDER.
#
# COULEURS. Bruin DAC attribue les couleurs de série par rang dans le résultat, sans
# permettre de fixer « Gagnée = vert ». Les issues sont donc énumérées en dur et
# jointes en LEFT JOIN pour rester dans un ordre constant même à zéro, et ce sont les
# étiquettes — pas la couleur — qui portent le sens.
filters:
  - name: periode
    type: select
    multiple: false
    default: "Depuis novembre 2025"
    options:
      values: ["Depuis novembre 2025", "12 derniers mois", "Depuis janvier 2026", "Tout l'historique"]

  - name: practice
    type: select
    multiple: false
    default: "Toutes"
    options:
      values: ["Toutes", "Digital Transformation", "Risk Advisory", "Data Management"]

rows:
  # === Q1 et Q3 : combien d'offres remises, et ce qu'elles sont devenues ===
  - widgets:
      - name: Offres remises
        type: metric
        col: 3
        description: >-
          Offres déposées sur la période, échéance déjà passée.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT COUNT(*) AS value FROM remises
        value: { field: value, type: number, format: ",.0f" }

      - name: Gagnées
        type: metric
        col: 3
        description: >-
          Gagnées ou déjà signées.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT COUNT(*) FILTER (WHERE issue = 'Gagnée') AS value FROM remises
        value: { field: value, type: number, format: ",.0f" }

      - name: Perdues
        type: metric
        col: 3
        description: >-
          Décision défavorable du client.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT COUNT(*) FILTER (WHERE issue = 'Perdue') AS value FROM remises
        value: { field: value, type: number, format: ",.0f" }

      - name: En attente
        type: metric
        col: 3
        description: >-
          Déposées, sans décision du client à ce jour.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT COUNT(*) FILTER (WHERE issue = 'En attente') AS value FROM remises
        value: { field: value, type: number, format: ",.0f" }

  - widgets:
      - name: Taux de réussite
        type: metric
        col: 4
        description: >-
          Gagnées ÷ offres décidées. Les offres en attente ne comptent pas au
          dénominateur.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT COUNT(*) FILTER (WHERE issue = 'Gagnée') * 1.0
                 / NULLIF(COUNT(*) FILTER (WHERE issue <> 'En attente'), 0) AS value FROM remises
        value: { field: value, type: number, format: ".1%" }

      - name: Budget remis
        type: metric
        col: 4
        description: >-
          Budget cumulé des offres déposées.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT SUM(budget) AS value FROM remises
        value: { field: value, type: number, format: ",.0f" }

      - name: Budget gagné
        type: metric
        col: 4
        description: >-
          Part du budget remis effectivement remportée.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT SUM(budget) FILTER (WHERE issue = 'Gagnée') AS value FROM remises
        value: { field: value, type: number, format: ",.0f" }

  - widgets:
      - name: Issue des offres remises
        type: chart
        chart: pie
        col: 6
        description: Part des offres gagnées, perdues et en attente.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          ),
          issues(issue, rang) AS (
            VALUES ('Gagnée', 1), ('Perdue', 2), ('En attente', 3)
          )
          SELECT i.issue, COUNT(r.id) AS nb
          FROM issues i
          LEFT JOIN remises r ON r.issue = i.issue
          GROUP BY i.issue, i.rang
          ORDER BY i.rang
        label: issue
        value: { field: nb }

      - name: Offres remises par practice
        type: chart
        chart: pie
        col: 6
        description: Répartition des dépôts entre les trois practices.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT practice, COUNT(*) AS nb
          FROM remises
          GROUP BY practice
          ORDER BY nb DESC
        label: practice
        value: { field: nb }

  - widgets:
      - name: Issue par practice
        type: chart
        chart: bar
        col: 6
        stacked: true
        # Barres empilées plutôt que côte à côte : la hauteur totale reste le volume
        # déposé par practice, lisible en même temps que sa composition.
        description: Où l'on gagne et où l'on perd, practice par practice.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          ),
          issues(issue, rang) AS (
            VALUES ('Gagnée', 1), ('Perdue', 2), ('En attente', 3)
          ),
          practices AS (SELECT DISTINCT practice FROM remises)
          SELECT p.practice, i.issue, COUNT(r.id) AS nb
          FROM practices p
          CROSS JOIN issues i
          LEFT JOIN remises r ON r.practice = p.practice AND r.issue = i.issue
          GROUP BY p.practice, i.issue, i.rang
          ORDER BY p.practice, i.rang
        x: { field: practice, type: category, title: Practice }
        y: { field: nb, type: number, title: Offres remises, format: ",.0f" }
        color: { field: issue }

      - name: Offres remises par mois
        type: chart
        chart: bar
        col: 6
        stacked: true
        # Barres empilées et non courbe : une courbe montrerait le volume mais pas sa
        # composition, qui est ici l'essentiel.
        description: Rythme de dépôt et issue, mois par mois.
        sql: |
          WITH remises AS (
            SELECT *,
              CASE
                WHEN status IN ('Offre gagnée', 'Offre signée') THEN 'Gagnée'
                WHEN status IN ('Offre perdue') THEN 'Perdue'
                ELSE 'En attente'
              END AS issue
            FROM opportunities
            WHERE status IN ('Offre remise', 'En attente du plan de charge', 'Offre gagnée', 'Offre signée', 'Offre perdue')
              AND deadline <= CURRENT_DATE
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          ),
          issues(issue, rang) AS (
            VALUES ('Gagnée', 1), ('Perdue', 2), ('En attente', 3)
          ),
          mois AS (SELECT DISTINCT deadline_month AS m FROM remises WHERE deadline_month IS NOT NULL)
          SELECT mo.m AS mois, i.issue, COUNT(r.id) AS nb
          FROM mois mo
          CROSS JOIN issues i
          LEFT JOIN remises r ON r.deadline_month = mo.m AND r.issue = i.issue
          GROUP BY mo.m, i.issue, i.rang
          ORDER BY mo.m, i.rang
        x: { field: mois, type: category, title: Mois d'échéance }
        y: { field: nb, type: number, title: Offres remises, format: ",.0f" }
        color: { field: issue }

  # === Affaires chaudes : les opportunités à 80 % de probabilité ou plus ===
  - widgets:
      - name: Affaires chaudes
        type: metric
        col: 4
        description: >-
          Opportunités à 80 % de probabilité ou plus. Le statut n'entre pas en compte.
        sql: |
          WITH chaudes AS (
            SELECT * FROM opportunities
            WHERE win_probability >= 0.8
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT COUNT(*) AS value FROM chaudes
        value: { field: value, type: number, format: ",.0f" }

      - name: Budget à forte confiance
        type: metric
        col: 4
        description: >-
          Budget cumulé des affaires chaudes.
        sql: |
          WITH chaudes AS (
            SELECT * FROM opportunities
            WHERE win_probability >= 0.8
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT SUM(budget) AS value FROM chaudes
        value: { field: value, type: number, format: ",.0f" }

      - name: Montant pondéré associé
        type: metric
        col: 4
        description: >-
          Offre financière × probabilité, sur ce même périmètre.
        sql: |
          WITH chaudes AS (
            SELECT * FROM opportunities
            WHERE win_probability >= 0.8
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT SUM(weighted_amount) AS value FROM chaudes
        value: { field: value, type: number, format: ",.0f" }

  - widgets:
      - name: Affaires chaudes par practice
        type: chart
        chart: bar
        col: 12
        description: Répartition des affaires chaudes entre les practices.
        sql: |
          WITH chaudes AS (
            SELECT * FROM opportunities
            WHERE win_probability >= 0.8
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT practice, COUNT(*) AS nb
          FROM chaudes
          GROUP BY practice
          ORDER BY nb DESC
        x: { field: practice, type: category, title: Practice }
        y: { field: nb, type: number, title: Affaires chaudes, format: ",.0f" }
        color: { field: practice }


  # Le tableau occupe sa propre ligne, sur toute la largeur.
  #
  # Aucune hauteur n'est posée sur cette ligne, et c'est délibéré : le tableau de
  # Bruin DAC ne défile pas verticalement — son élément externe porte
  # `overflow-x-auto`, sans hauteur ni `overflow-y`, à l'intérieur d'un cadre
  # `overflow-hidden`. Borner la ligne CLIPPERAIT donc les affaires suivantes au lieu
  # de les rendre atteignables. Le widget s'étire avec son contenu et c'est la page
  # qui défile : c'est la seule mise en page où les 105 affaires restent lisibles
  # depuis le dashboard lui-même.
  - widgets:
      - name: Détail des affaires chaudes
        type: table
        col: 12
        # À savoir en lisant les montants : dans ces données 100 % n'est pas une
        # prévision mais un constat — les 88 opportunités à 100 % sont exactement les
        # 88 déjà gagnées ou signées.
        description: Toutes les affaires chaudes, la plus forte espérance de gain d'abord.
        sql: |
          WITH chaudes AS (
            SELECT * FROM opportunities
            WHERE win_probability >= 0.8
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          )
          SELECT description, buyer, practice, budget,
                 ROUND(win_probability * 100) AS ponderation,
                 weighted_amount, deadline
          FROM chaudes
          ORDER BY weighted_amount DESC
        columns:
          - { name: description, label: Opportunité }
          - { name: buyer, label: Client }
          - { name: practice, label: Practice }
          - { name: budget, label: Budget, number: currency }
          - { name: ponderation, label: Pondération %, number: number }
          - { name: weighted_amount, label: Montant pondéré, number: currency }
          - { name: deadline, label: Échéance }

  # === Santé du portefeuille — affaires perdues exclues ===
  - widgets:
      - name: Budget actif
        type: metric
        col: 3
        description: >-
          Budget annoncé par le client, hors affaires perdues.
        sql: |
          SELECT SUM(budget) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ",.0f" }

      - name: Offre financière
        type: metric
        col: 3
        description: >-
          Montant proposé par DevoTeam, sur le même périmètre.
        sql: |
          SELECT SUM(financial_offer) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ",.0f" }

      - name: Écart offre / budget
        type: metric
        col: 3
        description: >-
          Négatif = nous chiffrons sous le budget du client.
        sql: |
          SELECT (SUM(financial_offer) - SUM(budget)) / NULLIF(SUM(budget), 0) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: "+.1%" }

      - name: Montant pondéré
        type: metric
        col: 3
        description: >-
          Offre × probabilité, sur les seules lignes où la probabilité est renseignée.
        sql: |
          SELECT SUM(weighted_amount) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ",.0f" }

  # === Pipeline : où en sont les affaires encore ouvertes ===
  - widgets:
      - name: Entonnoir de vente
        type: chart
        chart: funnel
        col: 6
        description: Opportunités ayant atteint au moins chaque étape.
        # Cumul depuis la fin : une opportunité signée a nécessairement franchi les
        # étapes précédentes. Compter les statuts bruts ne décroîtrait pas et ne
        # formerait donc pas un entonnoir (voir backend/sql_builder.funnel_sql).
        sql: |
          WITH etapes AS (
            SELECT status, COUNT(*) AS nb,
              CASE status
                WHEN 'Lead' THEN 1
                WHEN 'Opportunité détectée' THEN 2
                WHEN 'En cours de qualification' THEN 3
                WHEN 'Complément d''information' THEN 4
                WHEN 'En cours de préparation' THEN 5
                WHEN 'Propal shortlistée' THEN 6
                WHEN 'Manif shortlistée' THEN 7
                WHEN 'Manifestation remise' THEN 8
                WHEN 'Offre remise' THEN 9
                WHEN 'En attente du plan de charge' THEN 10
                WHEN 'Offre gagnée' THEN 11
                WHEN 'Offre signée' THEN 12
              END AS rang
            FROM opportunities
            WHERE status IN (
              'Lead', 'Opportunité détectée', 'En cours de qualification',
              'Complément d''information', 'En cours de préparation', 'Propal shortlistée',
              'Manif shortlistée', 'Manifestation remise', 'Offre remise',
              'En attente du plan de charge', 'Offre gagnée', 'Offre signée'
            )
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
            GROUP BY status
          )
          SELECT status, SUM(nb) OVER (ORDER BY rang DESC ROWS UNBOUNDED PRECEDING) AS atteint
          FROM etapes
          ORDER BY rang
        label: status
        value: { field: atteint }

      - name: Taux de passage entre étapes
        type: chart
        chart: bar
        col: 6
        description: Part qui franchit l'étape suivante.
        sql: |
          WITH etapes AS (
            SELECT status, COUNT(*) AS nb,
              CASE status
                WHEN 'Lead' THEN 1
                WHEN 'Opportunité détectée' THEN 2
                WHEN 'En cours de qualification' THEN 3
                WHEN 'Complément d''information' THEN 4
                WHEN 'En cours de préparation' THEN 5
                WHEN 'Propal shortlistée' THEN 6
                WHEN 'Manif shortlistée' THEN 7
                WHEN 'Manifestation remise' THEN 8
                WHEN 'Offre remise' THEN 9
                WHEN 'En attente du plan de charge' THEN 10
                WHEN 'Offre gagnée' THEN 11
                WHEN 'Offre signée' THEN 12
              END AS rang
            FROM opportunities
            WHERE status IN (
              'Lead', 'Opportunité détectée', 'En cours de qualification',
              'Complément d''information', 'En cours de préparation', 'Propal shortlistée',
              'Manif shortlistée', 'Manifestation remise', 'Offre remise',
              'En attente du plan de charge', 'Offre gagnée', 'Offre signée'
            )
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
            GROUP BY status
          ),
          cumul AS (
            SELECT status, rang,
              SUM(nb) OVER (ORDER BY rang DESC ROWS UNBOUNDED PRECEDING) AS atteint
            FROM etapes
          )
          SELECT status,
            atteint * 1.0 / NULLIF(LAG(atteint) OVER (ORDER BY rang), 0) AS taux
          FROM cumul
          ORDER BY rang
        x: { field: status, type: category, title: Étape }
        y: { field: taux, type: number, title: Taux de passage, format: ".0%" }
        color: { field: status }

  - widgets:
      - name: Budget actif par pays
        type: chart
        chart: bar
        col: 12
        description: Les 10 pays au budget actif le plus élevé.
        sql: |
          SELECT country, SUM(budget) AS budget FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          GROUP BY 1
          ORDER BY 2 DESC
          LIMIT 10
        x: { field: country, type: category, title: Pays }
        y: { field: budget, type: number, title: Budget, format: ",.0f" }
        color: { field: country }

  # === Ce qu'il faut traiter maintenant ===
  - widgets:
      - name: Opportunités urgentes (échéance ≤ 7 jours)
        type: table
        col: 12
        # Seul widget tourné vers l'avenir : la borne « à date » des offres remises ne
        # s'y applique pas, sinon il serait toujours vide.
        description: Affaires encore ouvertes dont l'échéance tombe dans les 7 jours.
        sql: |
          SELECT buyer, country, practice, status, deadline, days_remaining, budget
          FROM opportunities
          WHERE days_remaining BETWEEN 0 AND 7
            AND status NOT IN (
              'Offre gagnée', 'Offre perdue', 'Offre signée', 'Infructueux',
              'NO GO', 'Hors scope', 'Non shortlisté'
            )
          {% if filters.periode == 'Depuis novembre 2025' %}
            AND deadline >= DATE '2025-11-01'
          {% elif filters.periode == '12 derniers mois' %}
            AND deadline >= CURRENT_DATE - INTERVAL 12 MONTH
          {% elif filters.periode == 'Depuis janvier 2026' %}
            AND deadline >= DATE '2026-01-01'
          {% endif %}
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          ORDER BY days_remaining ASC
        columns:
          - { name: buyer, label: Client }
          - { name: country, label: Pays }
          - { name: practice, label: Practice }
          - { name: status, label: Statut }
          - { name: deadline, label: Échéance }
          - { name: days_remaining, label: Jours restants, number: number }
          - { name: budget, label: Budget, number: currency }
