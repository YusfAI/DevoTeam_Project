schema: https://getbruin.com/schemas/dac/dashboard/v1
name: Vue d'ensemble commerciale
description: Les questions les plus fréquentes sur le portefeuille d'opportunités
connection: devoteam_duckdb

# Dashboard "as code" : versionné dans git, relu en revue, reproductible à
# l'identique sur n'importe quelle machine. Les données proviennent du fichier
# DuckDB réécrit à chaque rafraîchissement du Google Sheet (backend/duckdb_export.py).
#
# RÈGLE APPLIQUÉE À TOUS LES WIDGETS : les affaires définitivement perdues (Offre
# perdue, Infructueux, NO GO, Hors scope, Non shortlisté) sont exclues. Elles
# représentent 66,1 M€ sur 164,4 M€ : les additionner dans un « budget total »
# donnait un chiffre inutilisable pour décider. Les gagnées et signées restent
# comptées — ce sont des succès, pas des pertes.
# La même règle est appliquée automatiquement aux dashboards générés par le chat
# (voir backend/business_rules.py::LOST_STATUSES), pour que les deux concordent.
#
# Les 12 étapes de l'entonnoir sont la transcription exacte de
# business_rules.FUNNEL_STAGE_ORDER : les deux widgets qui s'en servent doivent
# rester d'accord, sans quoi les taux de passage porteraient sur un pipeline
# différent de celui que l'entonnoir affiche.
#
# Le filtre ci-dessous est injecté en Jinja dans CHAQUE requête : changer la
# practice recalcule tout le dashboard côté SQL, sans rechargement de page.
filters:
  - name: practice
    type: select
    multiple: false
    default: "Toutes"
    options:
      values: ["Toutes", "Digital Transformation", "Risk Advisory", "Data Management"]

rows:
  # --- Ligne 1 : les trois montants. Budget et offre financière côte à côte parce
  # qu'ils diffèrent sur 349 des 350 lignes d'origine : n'en montrer qu'un laissait
  # croire qu'il n'y en avait qu'un. L'écart dit si l'on chiffre au-dessus ou en
  # dessous du budget annoncé par le client. ---
  - widgets:
      - name: Budget actif
        type: metric
        col: 4
        description: Budget estimé côté client, hors affaires perdues, infructueuses, NO GO, hors scope et non shortlistées.
        sql: |
          SELECT SUM(budget) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ",.0f" }

      - name: Offre financière
        type: metric
        col: 4
        description: Montant réellement proposé par DevoTeam, sur le même périmètre.
        sql: |
          SELECT SUM(financial_offer) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ",.0f" }

      - name: Écart offre / budget
        type: metric
        col: 4
        description: Négatif = nous chiffrons en dessous du budget annoncé par le client.
        sql: |
          SELECT (SUM(financial_offer) - SUM(budget)) / NULLIF(SUM(budget), 0) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: "+.1%" }

  # --- Ligne 2 : le volume et la qualité du portefeuille ---
  - widgets:
      - name: Opportunités
        type: metric
        col: 4
        sql: |
          SELECT COUNT(*) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ",.0f" }

      - name: Montant pondéré
        type: metric
        col: 4
        description: Offre financière × probabilité de gain, sur les seules opportunités où elle est renseignée — environ la moitié du portefeuille.
        sql: |
          SELECT SUM(weighted_amount) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ",.0f" }

      - name: Probabilité de gain moyenne
        type: metric
        col: 4
        sql: |
          SELECT AVG(win_probability) AS value FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
            AND win_probability IS NOT NULL
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
        value: { field: value, type: number, format: ".1%" }

  # --- Ligne 3 : « Où est l'argent ? » et « comment se répartit-il ? » ---
  - widgets:
      - name: Budget par pays
        type: chart
        chart: bar
        col: 7
        description: Les 10 pays au budget actif le plus élevé.
        sql: |
          SELECT country, SUM(budget) AS budget FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          GROUP BY 1
          ORDER BY 2 DESC
          LIMIT 10
        x: { field: country, type: category, title: Pays }
        y: { field: budget, type: number, title: Budget, format: ",.0f" }
        # Une couleur par pays plutôt qu'une teinte unique : chaque catégorie se
        # distingue immédiatement, et la légende relie les graphiques entre eux.
        color: { field: country }

      - name: Répartition par practice
        type: chart
        chart: pie
        # Élargi à 5 colonnes : le camembert affiche « nom NN% » à côté de chaque
        # part, et ces étiquettes sont rognées si le widget est trop étroit.
        col: 5
        description: Nombre d'opportunités actives par practice.
        sql: |
          SELECT practice, COUNT(*) AS nb FROM opportunities
          WHERE status NOT IN ('Offre perdue', 'Infructueux', 'NO GO', 'Hors scope', 'Non shortlisté')
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          GROUP BY 1
          ORDER BY 2 DESC
        label: practice
        value: { field: nb }

  # --- Ligne 4 : « Où en est le pipeline ? » et « où perd-on les affaires ? » ---
  - widgets:
      - name: Entonnoir de vente
        type: chart
        chart: funnel
        col: 6
        description: Nombre d'opportunités ayant atteint au moins chaque étape.
        # Cumul depuis la fin : une opportunité signée a nécessairement franchi les
        # étapes précédentes. Compter les statuts bruts ne décroîtrait pas et ne
        # formerait donc pas un entonnoir (voir backend/sql_builder.funnel_sql).
        # Les statuts de sortie sont déjà absents de la liste des étapes.
        sql: |
          WITH etapes AS (
            SELECT status, COUNT(*) AS nb,
              CASE status
                WHEN 'Lead' THEN 1
                WHEN 'Opportunité détectée' THEN 2
                WHEN 'En cours de qualification' THEN 3
                WHEN 'Complément d''information' THEN 4
                WHEN 'En cours de préparation' THEN 5
                WHEN 'Propal shortlistée' THEN 6
                WHEN 'Manif shortlistée' THEN 7
                WHEN 'Manifestation remise' THEN 8
                WHEN 'Offre remise' THEN 9
                WHEN 'En attente du plan de charge' THEN 10
                WHEN 'Offre gagnée' THEN 11
                WHEN 'Offre signée' THEN 12
              END AS rang
            FROM opportunities
            WHERE status IN (
              'Lead', 'Opportunité détectée', 'En cours de qualification',
              'Complément d''information', 'En cours de préparation', 'Propal shortlistée',
              'Manif shortlistée', 'Manifestation remise', 'Offre remise',
              'En attente du plan de charge', 'Offre gagnée', 'Offre signée'
            )
          {% if filters.practice != 'Toutes' %}
              AND practice = '{{ filters.practice }}'
          {% endif %}
            GROUP BY status
          )
          SELECT status, SUM(nb) OVER (ORDER BY rang DESC ROWS UNBOUNDED PRECEDING) AS atteint
          FROM etapes
          ORDER BY rang
        label: status
        value: { field: atteint }

      - name: Taux de passage entre étapes
        type: chart
        chart: bar
        col: 6
        description: Part des opportunités ayant atteint une étape qui franchissent la suivante.
        sql: |
          WITH etapes AS (
            SELECT status, COUNT(*) AS nb,
              CASE status
                WHEN 'Lead' THEN 1
                WHEN 'Opportunité détectée' THEN 2
                WHEN 'En cours de qualification' THEN 3
                WHEN 'Complément d''information' THEN 4
                WHEN 'En cours de préparation' THEN 5
                WHEN 'Propal shortlistée' THEN 6
                WHEN 'Manif shortlistée' THEN 7
                WHEN 'Manifestation remise' THEN 8
                WHEN 'Offre remise' THEN 9
                WHEN 'En attente du plan de charge' THEN 10
                WHEN 'Offre gagnée' THEN 11
                WHEN 'Offre signée' THEN 12
              END AS rang
            FROM opportunities
            WHERE status IN (
              'Lead', 'Opportunité détectée', 'En cours de qualification',
              'Complément d''information', 'En cours de préparation', 'Propal shortlistée',
              'Manif shortlistée', 'Manifestation remise', 'Offre remise',
              'En attente du plan de charge', 'Offre gagnée', 'Offre signée'
            )
          {% if filters.practice != 'Toutes' %}
              AND practice = '{{ filters.practice }}'
          {% endif %}
            GROUP BY status
          ),
          cumul AS (
            SELECT status, rang,
              SUM(nb) OVER (ORDER BY rang DESC ROWS UNBOUNDED PRECEDING) AS atteint
            FROM etapes
          )
          SELECT status,
            atteint * 1.0 / NULLIF(LAG(atteint) OVER (ORDER BY rang), 0) AS taux
          FROM cumul
          ORDER BY rang
        x: { field: status, type: category, title: Étape }
        y: { field: taux, type: number, title: Taux de passage, format: ".0%" }
        color: { field: status }

  # --- Ligne 5 : « Qu'est-ce qui est urgent ? » ---
  - widgets:
      - name: Opportunités urgentes (échéance ≤ 7 jours)
        type: table
        col: 12
        description: Opportunités encore ouvertes uniquement — les affaires closes ou perdues sont exclues.
        sql: |
          SELECT buyer, country, practice, status, deadline, days_remaining, budget
          FROM opportunities
          WHERE days_remaining BETWEEN 0 AND 7
            AND status NOT IN (
              'Offre gagnée', 'Offre perdue', 'Offre signée', 'Infructueux',
              'NO GO', 'Hors scope', 'Non shortlisté'
            )
          {% if filters.practice != 'Toutes' %}
            AND practice = '{{ filters.practice }}'
          {% endif %}
          ORDER BY days_remaining ASC
        columns:
          - { name: buyer, label: Client }
          - { name: country, label: Pays }
          - { name: practice, label: Practice }
          - { name: status, label: Statut }
          - { name: deadline, label: Échéance }
          - { name: days_remaining, label: Jours restants, number: number }
          - { name: budget, label: Budget, number: currency }
